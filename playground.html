<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sole Emails — Preview Playground</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #F5F4F8;
  --surface:   #FFFFFF;
  --surface2:  #F9FAFB;
  --surface3:  #EEF0FF;
  --border:    #E5E7EB;
  --border2:   #D1D5DB;
  --accent:    #4D4DFF;
  --accent2:   #EEF0FF;
  --text:      #0F1117;
  --text-soft: #1F2937;
  --muted:     #6B7280;
  --muted2:    #9CA3AF;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Top bar ─────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  height: 52px;
  padding: 0 14px 0 18px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  gap: 0;
}

.brand {
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text);
  white-space: nowrap;
  margin-right: 22px;
  flex-shrink: 0;
}
.brand em { color: var(--accent); font-style: normal; }

.tabs-wrap {
  display: flex;
  align-items: center;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
  gap: 2px;
}
.tabs-wrap::-webkit-scrollbar { display: none; }

.tab {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border: 1px solid transparent;
  white-space: nowrap;
  transition: color .12s, background .12s, border-color .12s;
  user-select: none;
  flex-shrink: 0;
}
.tab:hover { color: var(--text); background: var(--surface2); }
.tab.active {
  color: var(--text);
  background: var(--accent2);
  border-color: #DDE0FF;
}
.tab-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  opacity: 0;
  transition: opacity .12s;
}
.tab.active .tab-dot { opacity: 1; }

.btn-add {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border-radius: 8px;
  font-size: 15px;
  line-height: 1;
  color: var(--muted);
  cursor: pointer;
  border: 1px dashed var(--border2);
  background: transparent;
  flex-shrink: 0;
  margin-left: 6px;
  transition: color .12s, border-color .12s, background .12s;
}
.btn-add:hover { color: var(--accent); border-color: var(--accent); background: var(--accent2); }

.controls {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 14px;
  flex-shrink: 0;
}

.ctrl-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  transition: color .12s, background .12s, border-color .12s;
  white-space: nowrap;
  user-select: none;
  flex-shrink: 0;
}
.ctrl-btn:hover { color: var(--text); background: var(--surface2); }
.ctrl-btn.active {
  color: var(--accent);
  background: var(--accent2);
  border-color: #DDE0FF;
}

.sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; flex-shrink: 0; }

/* ── Canvas ──────────────────────────────── */
.canvas {
  flex: 1;
  overflow-x: auto;
  overflow-y: hidden;
  background:
    radial-gradient(circle at 1px 1px, rgba(15,17,23,.06) 1px, transparent 0) 0 0 / 22px 22px,
    var(--bg);
  padding: 28px 28px 28px;
}
.canvas::-webkit-scrollbar { height: 10px; }
.canvas::-webkit-scrollbar-track { background: transparent; }
.canvas::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 6px; border: 2px solid var(--bg); }

/* Three-column grid */
.grid {
  display: flex;
  gap: 28px;
  align-items: flex-start;
  height: 100%;
  width: max-content;
  min-width: 100%;
  justify-content: center;
  padding-bottom: 8px;
}

.col {
  display: flex;
  flex-direction: column;
  height: 100%;
  flex-shrink: 0;
}

.col-label {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 12px;
  padding: 0 4px;
}
.col-label .name {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--text-soft);
}
.col-label .px {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--muted2);
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
}

/* Device frames */
.device {
  background: #ffffff;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Desktop */
.device-desktop {
  width: 900px;
  border-radius: 14px;
  box-shadow:
    0 1px 2px rgba(15,17,23,.04),
    0 8px 32px rgba(15,17,23,.08),
    0 0 0 1px var(--border);
}
.chrome-bar {
  background: #F3F4F6;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chrome-dots { display: flex; gap: 6px; }
.chrome-dots span { width: 10px; height: 10px; border-radius: 50%; }
.chrome-dots span:nth-child(1) { background: #FF5F57; }
.chrome-dots span:nth-child(2) { background: #FFBD2E; }
.chrome-dots span:nth-child(3) { background: #28C840; }
.chrome-url {
  flex: 1;
  height: 22px;
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: 5px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  font-size: 10.5px;
  color: var(--muted);
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  letter-spacing: .2px;
}

.email-client-bar {
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--border);
  background: #FFFFFF;
  flex-shrink: 0;
}
.email-client-bar.dark-ec {
  background: #131418;
  border-bottom-color: #25272E;
}
.ec-subject {
  font-size: 13px;
  font-weight: 600;
  color: #0F1117;
  margin-bottom: 3px;
  font-family: -apple-system, sans-serif;
}
.ec-subject.dark-text { color: #E4E7ED; }
.ec-meta {
  font-size: 10.5px;
  color: var(--muted);
  font-family: -apple-system, sans-serif;
}
.ec-meta.dark-text { color: #8B919E; }

.scroll-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background: #F5F4F8;
}
.scroll-area::-webkit-scrollbar { width: 8px; }
.scroll-area::-webkit-scrollbar-track { background: transparent; }
.scroll-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* Mobile */
.device-mobile {
  width: 393px;
  border-radius: 22px;
  padding: 10px;
  background: #FFFFFF;
  box-shadow:
    0 0 0 1px var(--border),
    0 8px 32px rgba(15,17,23,.08);
}
.device-mobile .scroll-area { border-radius: 12px; }
.device-mobile .email-client-bar { border-radius: 12px 12px 0 0; }

iframe {
  display: block;
  width: 100%;
  border: none;
  background: transparent;
}

/* ── Status bar ──────────────────────────── */
.statusbar {
  height: 32px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  font-size: 11px;
  color: var(--muted);
  flex-shrink: 0;
}
.status-pill {
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--surface2);
  border: 1px solid var(--border);
  font-size: 10.5px;
  color: var(--muted);
}
.status-pill.accent { background: var(--accent2); border-color: #DDE0FF; color: var(--accent); font-weight: 600; }
.status-pill.dot::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #10B981;
  margin-right: 6px;
  vertical-align: 1px;
}
.spacer { flex: 1; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">Sole <em>Emails</em></div>

  <div class="tabs-wrap" id="tabsWrap">
    <!-- tabs injected by JS -->
  </div>

  <button class="btn-add" title="Add template" onclick="promptAddTemplate()">+</button>

  <div class="controls">
    <div class="sep"></div>
    <button class="ctrl-btn active" id="btnSync" onclick="toggleSync()" title="Sync scroll across all viewports">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 5 L8 1 L13 5 M3 11 L8 15 L13 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Sync scroll
    </button>
    <button class="ctrl-btn" id="btnDark" onclick="toggleDark()" title="Toggle email client chrome appearance">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M11.5 9.5A5 5 0 0 1 6.5 4.5C6.5 3.6 6.7 2.7 7 2A6 6 0 1 0 14 9c-.7.3-1.6.5-2.5.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      Dark client
    </button>
    <button class="ctrl-btn" id="btnReload" onclick="loadTemplate(activeKey)" title="Reload template">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9 M13.5 2v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Reload
    </button>
  </div>
</div>

<!-- CANVAS -->
<div class="canvas" id="canvas">
  <div class="grid">

    <!-- DESKTOP -->
    <div class="col">
      <div class="col-label"><span class="name">Desktop</span><span class="px">900px</span></div>
      <div class="device device-desktop">
        <div class="chrome-bar">
          <div class="chrome-dots"><span></span><span></span><span></span></div>
          <div class="chrome-url">mail.google.com — Inbox</div>
        </div>
        <div class="email-client-bar" id="ecb-desktop">
          <div class="ec-subject" id="ecs-desktop">Sole Practice Manager — Priority Access</div>
          <div class="ec-meta" id="ecm-desktop">Johann Oberholzer &lt;hello@soleapp.com.au&gt; · to me</div>
        </div>
        <div class="scroll-area" data-sync="true">
          <iframe id="if-desktop" title="Desktop preview"></iframe>
        </div>
      </div>
    </div>

    <!-- MOBILE -->
    <div class="col">
      <div class="col-label"><span class="name">Mobile</span><span class="px">393px</span></div>
      <div class="device device-mobile">
        <div class="email-client-bar" id="ecb-mobile">
          <div class="ec-subject" id="ecs-mobile" style="font-size:12px">Sole Practice Manager — Priority Access</div>
          <div class="ec-meta" id="ecm-mobile">Johann · to me</div>
        </div>
        <div class="scroll-area" data-sync="true">
          <iframe id="if-mobile" title="Mobile preview"></iframe>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- STATUS BAR -->
<div class="statusbar">
  <span class="status-pill dot">Live</span>
  <span class="status-pill accent" id="stat-mode">Light email</span>
  <span class="status-pill" id="stat-count">1 template</span>
  <div class="spacer"></div>
  <span style="font-size:10.5px;color:var(--muted2)">Scroll either device — both sync</span>
</div>

<script>
/* ─────────────────────────────────────────────────────────────────────────────
   Config
───────────────────────────────────────────────────────────────────────────── */
const TEMPLATES = {
  'priority-access':    { label: '1 · Priority Access',    file: 'email-template.html' },
  'disconnected':       { label: '2 · Disconnected',       file: 'email-2-disconnected.html' },
  'how-spm-works':      { label: '3 · How SPM Works',      file: 'email-3-how-spm-works.html' },
  'supported-rollout':  { label: '4 · Supported Rollout',  file: 'email-4-supported-rollout.html' },
  'close-the-loop':     { label: '5 · Close the Loop',     file: 'email-5-close-the-loop.html' }
  // Add new templates: 'key': { label: 'Name', file: 'file.html' }
};

const IFRAMES = {
  'if-mobile':  { viewport: 393 },
  'if-desktop': { viewport: null }  // null = use natural device width
};

const DARK_TARGETS = {
  bars:    ['ecb-mobile','ecb-desktop'],
  texts:   ['ecs-mobile','ecs-desktop','ecm-mobile','ecm-desktop'],
};

/* ─────────────────────────────────────────────────────────────────────────────
   State
───────────────────────────────────────────────────────────────────────────── */
let activeKey   = 'priority-access';
let darkClient  = false;
let syncOn      = true;
let blobUrls    = {};

/* ─────────────────────────────────────────────────────────────────────────────
   Template loading
───────────────────────────────────────────────────────────────────────────── */
async function loadTemplate(key) {
  const tpl = TEMPLATES[key];
  if (!tpl) return;

  let html;
  try {
    const res = await fetch(tpl.file + '?_=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    html = await res.text();
  } catch (err) {
    html = `<body style="font-family:-apple-system,sans-serif;padding:40px;color:#EF4444;background:#FEE2E2">
      <strong>Could not load ${tpl.file}</strong><br><br>
      <code style="font-size:12px">${err.message}</code><br><br>
      Serve this directory over HTTP, e.g.:<br>
      <code style="font-size:12px;background:#fff;padding:4px 8px;display:inline-block;border-radius:4px">python3 -m http.server 8765</code>
    </body>`;
  }

  // Replace merge tags with preview values
  html = html
    .replace(/\{\{tidycal_link\}\}/g,                       '#')
    .replace(/\{\{video_link\}\}/g,                         'https://www.youtube.com/watch?v=yg6JAxNp9nw')
    .replace(/\{\{contact\.first_name\}\}/g,                'Sarah')
    .replace(/\{\{custom_values\.founders_signature\}\}/g,  'Founder, Sole &amp; SPM');

  // Inject a <base href> so relative paths (e.g. assets/hero/practice-dashboard.png)
  // in the email resolve against the http server, not the iframe's blob: URL.
  // Production emails will swap these to absolute CDN URLs before send (see SHIPPING.md).
  const baseTag = `<base href="${window.location.origin}/"/>`;
  if (/<head[^>]*>/i.test(html)) {
    html = html.replace(/<head[^>]*>/i, m => m + baseTag);
  }

  // Load each iframe with its viewport-overridden HTML
  for (const [ifId, cfg] of Object.entries(IFRAMES)) {
    const processed = cfg.viewport ? overrideViewport(html, cfg.viewport) : html;
    loadIntoIframe(ifId, processed);
  }
}

/* Override <meta viewport> so the iframe's media queries fire at the simulated
   device width, not the iframe's physical pixel width. */
function overrideViewport(html, width) {
  const tag = `<meta name="viewport" content="width=${width},initial-scale=1"/>`;
  if (/<meta[^>]*name=["']viewport["'][^>]*>/i.test(html)) {
    return html.replace(/<meta[^>]*name=["']viewport["'][^>]*\/?>/i, tag);
  }
  return html.replace(/<head[^>]*>/i, m => m + tag);
}

function loadIntoIframe(ifId, html) {
  const iframe = document.getElementById(ifId);
  if (!iframe) return;

  if (blobUrls[ifId]) URL.revokeObjectURL(blobUrls[ifId]);

  const blob = new Blob([html], { type: 'text/html; charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  blobUrls[ifId] = url;

  // Auto-size iframe height to its content once loaded so the whole email
  // sits inside its scroll-area parent and the parent scrollbar drives sync.
  iframe.onload = () => {
    try {
      const doc = iframe.contentDocument;
      if (!doc) return;
      const h = Math.max(
        doc.body?.scrollHeight || 0,
        doc.documentElement?.scrollHeight || 0
      );
      if (h > 0) iframe.style.height = h + 'px';
    } catch (e) { /* cross-origin (won't happen for blob) */ }
  };

  iframe.src = url;
}

/* ─────────────────────────────────────────────────────────────────────────────
   Synced scrolling
   All three scroll-area containers stay at the same scroll fraction.
───────────────────────────────────────────────────────────────────────────── */
const scrollAreas = Array.from(document.querySelectorAll('.scroll-area[data-sync="true"]'));
let isSyncing = false;

scrollAreas.forEach(area => {
  area.addEventListener('scroll', () => {
    if (!syncOn || isSyncing) return;
    isSyncing = true;
    const max = area.scrollHeight - area.clientHeight;
    const frac = max > 0 ? area.scrollTop / max : 0;
    scrollAreas.forEach(other => {
      if (other === area) return;
      const otherMax = other.scrollHeight - other.clientHeight;
      other.scrollTop = otherMax * frac;
    });
    // Release on next frame so the programmatic scrolls don't re-fire
    requestAnimationFrame(() => { isSyncing = false; });
  }, { passive: true });
});

function toggleSync() {
  syncOn = !syncOn;
  document.getElementById('btnSync').classList.toggle('active', syncOn);
}

/* ─────────────────────────────────────────────────────────────────────────────
   Dark client toggle (only affects the playground's email-client chrome,
   not the email content itself — the email is intentionally light-only)
───────────────────────────────────────────────────────────────────────────── */
function toggleDark() {
  darkClient = !darkClient;
  document.getElementById('btnDark').classList.toggle('active', darkClient);
  document.getElementById('stat-mode').textContent = darkClient ? 'Dark client chrome' : 'Light email';
  DARK_TARGETS.bars.forEach(id => document.getElementById(id)?.classList.toggle('dark-ec', darkClient));
  DARK_TARGETS.texts.forEach(id => document.getElementById(id)?.classList.toggle('dark-text', darkClient));
}

/* ─────────────────────────────────────────────────────────────────────────────
   Tabs
───────────────────────────────────────────────────────────────────────────── */
function renderTabs() {
  const wrap = document.getElementById('tabsWrap');
  wrap.innerHTML = '';
  for (const [key, tpl] of Object.entries(TEMPLATES)) {
    const el = document.createElement('div');
    el.className = 'tab' + (key === activeKey ? ' active' : '');
    el.dataset.key = key;
    el.innerHTML = `<span class="tab-dot"></span>${tpl.label}`;
    el.onclick = () => {
      activeKey = key;
      renderTabs();
      loadTemplate(key);
    };
    wrap.appendChild(el);
  }
  const n = Object.keys(TEMPLATES).length;
  document.getElementById('stat-count').textContent = n + ' template' + (n > 1 ? 's' : '');
}

function promptAddTemplate() {
  alert(
    'To add a new template:\n\n' +
    '1. Drop your email HTML file into this directory\n' +
    '2. Open playground.html in a code editor\n' +
    '3. Add an entry to the TEMPLATES object at the top of the <script> block:\n\n' +
    "  'my-key': { label: 'My Template', file: 'my-email.html' }"
  );
}

/* ─────────────────────────────────────────────────────────────────────────────
   Init
───────────────────────────────────────────────────────────────────────────── */
renderTabs();
loadTemplate(activeKey);

// Live reload: poll the template file's last-modified, reload when it changes
let lastMod = null;
setInterval(async () => {
  try {
    const res = await fetch(TEMPLATES[activeKey].file + '?_check=' + Date.now(), { method: 'HEAD' });
    const mod = res.headers.get('last-modified');
    if (lastMod && mod && mod !== lastMod) loadTemplate(activeKey);
    lastMod = mod;
  } catch (e) { /* offline */ }
}, 1500);
</script>
</body>
</html>
